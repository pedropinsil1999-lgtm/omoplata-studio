[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# cache longo para fontes, imagens e JS com hash
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/coluna/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
